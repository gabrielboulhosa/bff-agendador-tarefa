name: Maven CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only needs to read repository contents.
permissions:
  contents: read

# Avoid running multiple builds for the same branch or pull request at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Download the source code so Maven can build it.
      - name: Check out source code
        uses: actions/checkout@v4

      # Use the same Java version configured in pom.xml and cache Maven dependencies.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # clean verify compiles the project, runs tests, and checks the package.
      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      # Keep the packaged application available for download from the workflow run.
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # Preserve test reports even when the test step fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7
